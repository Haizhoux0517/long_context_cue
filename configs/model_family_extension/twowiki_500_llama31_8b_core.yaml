dataset_path: data/processed/twowiki_cue_500.jsonl
output_dir: outputs/model_family_extension/twowiki_500_llama31_8b
model:
  provider: ollama
  model_name: llama3.1:8b
  num_ctx: 32768
  timeout: 600
generation:
  max_tokens: 1024
  temperature: 0.0
methods:
- no_evidence
- direct
- retrieve_then_read
- oracle
retrieval:
  top_k: 3
  chunk_size: 220
  overlap: 40
evaluation:
  compute_cue: true
  compute_failure_types: true
logging:
  save_full_prompts: false
  save_intermediate: true
  compress_outputs: false
protocol:
  version: diagnostic_v1_fixed
