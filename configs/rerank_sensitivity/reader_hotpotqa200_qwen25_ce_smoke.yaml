dataset_name: hotpotqa_oncu_200
dataset_path: /workspace/long_context_cue/data/processed/hotpotqa_cue_200.jsonl
output_dir: /workspace/long_context_cue/outputs/rerank_sensitivity_20260602/smoke_hotpotqa200_qwen25_ce
reference_metrics_path: /workspace/long_context_cue/experiment_backups/sci200_final_3model_20260525/hotpotqa_qwen25_14b_200_core_final/results/per_sample_metrics.csv

model:
  provider: ollama
  model_name: qwen2.5:14b
  num_ctx: 32768
  timeout: 900

generation:
  max_tokens: 1024
  temperature: 0.0

retriever_family:
  retrievers:
    - lexical
    - hybrid
    - hybrid_ce64
  top_k:
    - 3
    - 16

  reader_retrievers:
    - hybrid_ce64
  reader_top_k:
    - 16

  chunk_size: 220
  overlap: 40
  dense_model_name: sentence-transformers/all-MiniLM-L6-v2
  rrf_k: 60

  ce_rerank_model_name: cross-encoder/ms-marco-MiniLM-L6-v2
  ce_rerank_batch_size: 32
  ce_rerank_device: auto

logging:
  save_full_prompts: false
