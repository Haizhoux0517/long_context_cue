dataset_path: data/processed/hotpotqa_cue_100.jsonl
output_dir: outputs/hotpotqa_qwen7b_100_core
model:
  provider: ollama
  model_name: qwen2.5:7b
  num_ctx: 32768
  timeout: 600
generation:
  max_tokens: 512
  temperature: 0.0
methods:
- no_evidence
- direct
- retrieve_then_read
- oracle
retrieval:
  top_k: 3
  chunk_size: 220
  overlap: 40
evaluation:
  compute_cue: true
  compute_failure_types: true
logging:
  save_full_prompts: false
  save_intermediate: true
  compress_outputs: false
protocol:
  version: diagnostic_v1_fixed
  purpose: fixed diagnostic evaluation; no per-model prompt tuning
